version: "3.8"

services:
  # 组件预览服务
  nexa-ui-preview:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    restart: unless-stopped

  # VitePress 文档服务
  nexa-ui-docs:
    build:
      context: .
      dockerfile: Dockerfile.docs
    ports:
      - "3001:80"
    restart: unless-stopped
